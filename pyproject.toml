[project]
name = "curious-minds"
version = "0.1.0"
description = "Four Streamlit science sandboxes powered by Claude"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "anthropic>=0.39",
  "pydantic>=2.6",
  "plotly>=5.20",
  "networkx>=3.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
